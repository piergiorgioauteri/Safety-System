<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Trova i rischi Encuentra los riesgos</title>

<style>
 body {
   font-family: Arial, sans-serif;
   text-align: center;
   background: #ffffff;
   margin: 0;
 }

 /* HEADER CON LOGO */
 #header {
   background: #ffffff;
   padding: 10px;
   border-bottom: 1px solid #ccc;
 }

 #header img {
   max-height: 60px;
   width: auto;
 }

 /* CONTATORE */
 #counter {
   background: #ffffff;
   padding: 10px;
   font-size: 18px;
   font-weight: bold;
   position: sticky;
   top: 0;
   z-index: 10;
 }

 /* AREA IMMAGINE */
 #container {
   position: relative;
   display: inline-block;
 }

 img.main-image {
   width: 100%;
   max-width: 900px;
 }

 .spot {
   position: absolute;
   width: 50px;
   height: 50px;
   background: transparent;
   border: none;
   cursor: pointer;
 }
</style>

<script>
let foundCount = 0;
const totalErrors = 6;
let foundSpots = {};

function updateCounter() {
  document.getElementById("counter").innerText =
    "Rischi trovati, Riesgos encontrados: " + foundCount + " / " + totalErrors;
}

function found(id, text){
  event.stopPropagation();

  if (foundSpots[id]) {
    alert("ℹ️ Rischio già individuato, Riesgo ya identificado.");
    return;
  }

  foundSpots[id] = true;
  foundCount++;
  updateCounter();

  alert("✅ Rischio individuato,Riesgo identificado:\n\n" + text);

  if (foundCount === totalErrors) {
    alert("🎉 Complimenti!\nHai individuato tutti i rischi presenti\n 🎉¡Felicidades!\nHas identificado todos los riesgos presentes..");
  }
}

function wrong(){
  alert("❌ Qui non è stato individuato un rischio\n❌Aquí no se ha identificado ningún riesgo. ");
}
</script>

</head>

<body onload="updateCounter()">

<!-- LOGO AZIENDALE -->
<div id="header">
  <img src="logo_azienda.png" alt="Logo aziendale">
</div>

<!-- CONTATORE -->
<div id="counter"></div>

<h2>Trova i rischi nell'immagine, Encuentra los riesgos en la imagen</h2>
<p>Tocca le zone dove vedi un rischio, Toca las zonas donde veas un riesgo.</p>

<div id="container" onclick="wrong()">

  <img src="giga-factory.png" alt="Area produttiva" class="main-image">

  <!-- Carrello + telefono -->
  <div class="spot" style="top:43%;left:55%;"
    onclick="found('e1','Uso del telefono durante la guida del carrello elevatore\nUso del teléfono durante la conducción del carretilla elevadora.')"></div>

  <!-- Pedone nella corsia -->
  <div class="spot" style="top:48%;left:40%;"
    onclick="found('e2','Mancanza di DPI adeguati.\nFalta de equipos de protección individual (EPI) adecuados.')"></div>

  <!-- Uscita di emergenza -->
  <div class="spot" style="top:55%;left:87%;"
    onclick="found('e3','Uscita di emergenza bloccata.\nSalida de emergencia bloqueada.')"></div>

  <!-- Sporcizia 1 -->
  <div class="spot" style="top:55%;left:72%;"
    onclick="found('e4','Presenza di sporco e rifiuti a terra: rischio di inciampo.\nPresencia de suciedad y residuos en el suelo: riesgo de tropiezo.')"></div>

  <!-- Sporcizia 2 -->
  <div class="spot" style="top:69%;left:25%;"
    onclick="found('e5','Presenza di sporco e rifiuti a terra: rischio di inciampo.\nPresencia de suciedad y residuos en el suelo: riesgo de tropiezo.')"></div>

  <!-- Senza DPI -->
  <div class="spot" style="top:53%;left:1%;"
    onclick="found('e6','Mancanza di DPI adeguati.\nFalta de equipos de protección individual (EPI) adecuados.')"></div>

</div>

</body>
</html>
