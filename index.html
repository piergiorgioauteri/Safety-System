<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Trova i Pericoli</title>

<style>
 body {
   font-family: Arial, sans-serif;
   text-align: center;
   background: #f4f4f4;
   margin: 0;
 }

 /* HEADER CON LOGO */
 #header {
   background: #ffffff;
   padding: 10px;
   border-bottom: 1px solid #ccc;
 }

 #header img {
   max-height: 60px;
   width: auto;
 }

 /* CONTATORE */
 #counter {
   background: #ffffff;
   padding: 10px;
   font-size: 18px;
   font-weight: bold;
   position: sticky;
   top: 0;
   z-index: 10;
 }

 /* AREA IMMAGINE */
 #container {
   position: relative;
   display: inline-block;
 }

 img.main-image {
   width: 100%;
   max-width: 900px;
 }

 .spot {
   position: absolute;
   width: 50px;
   height: 50px;
   background: transparent;
   border: none;
   cursor: pointer;
 }
</style>

<script>
let foundCount = 0;
const totalErrors = 6;
let foundSpots = {};

function updateCounter() {
  document.getElementById("counter").innerText =
    "Pericoli trovati: " + foundCount + " / " + totalErrors;
}

function found(id, text){
  event.stopPropagation();

  if (foundSpots[id]) {
    alert("ℹ️ Pericolo già individuato.");
    return;
  }

  foundSpots[id] = true;
  foundCount++;
  updateCounter();

  alert("✅ Pericolo individuato:\n\n" + text);

  if (foundCount === totalErrors) {
    alert("🎉 Complimenti!\nHai individuato tutti i pericoli presenti.");
  }
}

function wrong(){
  alert("❌ Qui non è stato individuato un pericolo.");
}
</script>

</head>

<body onload="updateCounter()">

<!-- LOGO AZIENDALE -->
<div id="header">
  logo_azienda.png
</div>

<!-- CONTATORE -->
<div id="counter"></div>

<h2>Trova i pericoli nell'immagine</h2>
<p>Tocca le zone che secondo te sono pericolose</p>

<div id="container" onclick="wrong()">

  giga-factory.png

  <!-- Carrello + telefono -->
  <div class="spot" style="top:43%;left:55%;"
    onclick="found('e1','Uso del telefono durante la guida del carrello elevatore.')"></div>

  <!-- Pedone nella corsia -->
  <div class="spot" style="top:48%;left:40%;"
    onclick="found('e2','Pedone nella corsia di transito dei carrelli.')"></div>

  <!-- Materiale a terra -->
  <div class="spot" style="top:55%;left:87%;"
    onclick="found('e3','Materiale lasciato nella corsia di marcia.')"></div>

  <!-- Sporcizia 1 -->
  <div class="spot" style="top:55%;left:72%;"
    onclick="found('e4','Presenza di sporco e detriti a terra: rischio di inciampo.')"></div>

  <!-- Sporcizia 2 -->
  <div class="spot" style="top:69%;left:25%;"
    onclick="found('e5','Pavimentazione non mantenuta pulita.')"></div>

  <!-- Senza DPI -->
  <div class="spot" style="top:53%;left:1%;"
    onclick="found('e6','Operatore senza adeguati dispositivi di protezione individuale.')"></div>

</div>

</body>
</html>
